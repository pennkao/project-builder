version: "2"
sql:
  - engine: "postgresql"
    queries: "./sql/query"
    schema: "./sql/migration"
    gen:
      go:
        package: "db"
        out: "./db"
        sql_package: "pgx/v5" # 👈 关键：使用 pgx 而非 lib/pq
        emit_json_tags: true
        overrides:
          # 非空 jsonb → 值类型
          - db_type: "jsonb"
            nullable: false
            go_type:
              import: "github.com/cms/dbtypes"
              type: "JSON"

          # 可空 jsonb → 指针类型
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "github.com/cms/dbtypes"
              type: "JSON"
              pointer: true
